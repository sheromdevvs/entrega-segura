<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="230" viewBox="0 0 1020 230" role="img" aria-label="Buyer approves 24 dollars. 12 captured for production, 12 held until delivery. Correct code captures balance; refusal voids balance."><rect width="1020" height="230" rx="14" fill="#F6F6F6"/><g font-family="Arial,sans-serif" fill="#111111"><text x="30" y="36" font-size="12" letter-spacing="2">ONE APPROVAL. TWO MOMENTS OF PAYMENT. USD · PAYPAL SANDBOX</text><g font-size="17"><text x="30" y="88">Buyer approves $24</text><text x="290" y="88">Capture $12 now</text><text x="570" y="88">Hold $12 balance</text><text x="800" y="88">Delivery + code</text></g><g font-size="12" fill="#737373"><text x="30" y="115">Orders v2 · AUTHORIZE</text><text x="290" y="115">final_capture: false</text><text x="570" y="115">Time-limited authorization</text><text x="800" y="115">Capture $12 · final: true</text></g><g font-size="24" fill="#111111"><text x="240" y="94">→</text><text x="505" y="94">→</text><text x="750" y="94">→</text></g><path d="M 680 133 V 163 H 800" fill="none" stroke="#BDBDBD"/><text x="810" y="170" font-size="14">Refused → void remaining $12</text><text x="30" y="204" font-size="11" fill="#737373">AI interprets messages and evidence. Deterministic rules decide money. Defects and incomplete deliveries require shop review.</text></g></svg>